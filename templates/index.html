<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>非机动车识别与记录管理</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><main><header><div class="eyebrow">YOLOv5 · Flask · SQLite</div><h1>非机动车识别与记录管理</h1><p>图片检测、摄像头预览与本地车辆台账 · 2026年11月课程项目重建版</p></header>
<aside>默认 COCO 模型仅检测 bicycle（自行车），不具备专门的电动自行车、三轮车分类或车牌 OCR 能力。车辆编号由人工录入。</aside><div id="message" role="status" aria-live="polite"></div>
<section><h2>图片检测</h2><form id="detect-form"><label for="image">选择图片（JPEG / PNG / WebP，最大8MB）</label><div class="row"><input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp" required><button type="submit">开始检测</button></div></form><p id="summary"></p><img id="result-image" alt="带检测框的识别结果" hidden></section>
<section><h2>摄像头预览</h2><p>使用运行服务的电脑上的摄像头，预览帧不会自动入库。</p><div class="row"><button id="camera-start">开启预览</button><button id="camera-stop" class="secondary">停止预览</button></div><img id="camera-image" alt="摄像头实时检测画面" hidden></section>
<section><h2>车辆台账</h2><form id="vehicle-form"><input id="vehicle-id" type="hidden"><div class="fields"><label>车辆编号<input id="plate" maxlength="32" placeholder="例如 DEMO-001" required></label><label>车辆类型<input id="vehicle-type" maxlength="32" value="自行车" required></label><label>备注<input id="note" maxlength="300" placeholder="选填"></label></div><div class="row"><button type="submit">保存车辆</button><button id="cancel-edit" type="button" class="secondary">取消编辑</button></div></form>
<form id="search-form" class="row"><input id="search" aria-label="按车辆编号查询" placeholder="按车辆编号查询"><button class="secondary">查询</button></form><div class="table-wrap"><table><thead><tr><th>编号</th><th>类型</th><th>备注</th><th>操作</th></tr></thead><tbody id="vehicles"></tbody></table></div><div class="row"><button id="previous" class="secondary">上一页</button><span id="page">第1页</span><button id="next" class="secondary">下一页</button></div></section>
<section><div class="row"><h2>最近检测记录</h2><button id="refresh" class="secondary">刷新记录</button></div><div id="history"></div></section><footer>数据保存在本机 runtime 目录。首次推理需要下载官方模型或配置本地模型。</footer></main><script src="{{ url_for('static',filename='app.js') }}"></script></body></html>
